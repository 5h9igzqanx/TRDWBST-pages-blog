{{ define "main" }}
    <meta name="robots" content="noindex,nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <div class="cnt">
        {{ .Content }}
    </div>
    <div class="cnt-contact">
        {{ $contact := .Params.contact | default "棍母" }}
        <h2>联系方式</h2>
        {{ range $contact }}
            <a href="{{ .url }}" class="contactCard">
                <p><b>{{ .name }}</b>:{{ .content }}</p>
            </a>
        {{ end }}
    </div>
{{ end }}
