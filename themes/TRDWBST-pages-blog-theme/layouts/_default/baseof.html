<!DOCTYPE html>
<html lang="zh" dir="{{ or site.Language.LanguageDirection `ltr` }}">
    <head>
        <meta charset="utf-8">
        {{ partial "head.html" . }}
        <style>
            :root{
                --zhengTi-ZiTi-wenZi:"ZX-C-霞鹜文楷","Times New Roman","Arial","楷体","宋体";
                --zhengTi-peiSe-qian: #e6eef2;
                --zhengTi-peiSe-zhong: #dae9f2;
                --zhengTi-peiSe-shen: #cee5f2;
            }
        </style>
        <style>
            body{
                background-color: var(--zhengTi-peiSe-qian);
                font-family: var(--zhengTi-ZiTi-wenZi);
                line-height: 1.5;
            }
            .leftMain{
                /* float:left; */
                position:absolute;
                left:0px;
                top: 100px;
                width: 300px;
                height: auto;
            }
            .rightCnt{
                /* width: calc(100vw-120px); */
                position: absolute;
                /* top:30px; */
                left: 300px;
                right: 10px;
                top: 100px;
            }
            .footer{
                border: solid 20px var(--zhengTi-peiSe-zhong);
                background-color: var(--zhengTi-peiSe-qian);
                border-radius: 25px;
                padding: 20px;
                padding-bottom: 10px;
                border-bottom: 0px;
                border-bottom-left-radius: 0px;
                border-bottom-right-radius: 0px;
                font-family: var(--zhengTi-ZiTi-wenZi);
                text-align: center;
            }
            @media screen and (max-width:1000px){
                body>main{
                    padding-top:80px;
                    padding-left: 20px;
                    padding-right: 20px;
                }
                .leftMain{
                    position:static;
                    left: 0;
                    width: 100%;
                }
                .leftMainBox{
                    margin-right: 0px !important;
                    margin-left: 0px !important;
                    padding-left: 8px !important; 
                    padding-right: 8px !important;
                    border-radius: 25px;
                }
                .rightCnt{
                    position: static !important;
                    /* left: 190px; */
                }
            }
        </style>
    </head>
    <body>
        <header>
            {{ partial "header.html" . }}
        </header>
        <main>
            <div class="leftMain" id="leftMain">{{ partial "leftmain.html" . }}</div>
            <div class="rightCnt">
                {{ block "main" . }}{{ end }}
                <br>
                <footer class="footer">
                    <p>Copyrignt© 2024 - 2025 5h9igzqanx 版权所有</p>
                    <p>技术栈：CSS GithubPages HTML Hugo IntenseDebate JavaScript MathJax等（按照首字母顺序排列）</p>
                </footer>
            </div>
        </main>
    </body>
</html>
